[project]
name = "blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EmreKaplan67", email = "emrekaplan96@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "psycopg2>=2.9.12",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
blog = "blog:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
